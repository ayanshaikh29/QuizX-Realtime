<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuizX | Available Quizzes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: #f6f8fb;
            font-family: 'Inter', sans-serif;
        }

        /* ================= NAVBAR ================= */
        .navbar {
            background: linear-gradient(120deg, #6fbf4a, #8ed36a);
            padding: 14px 24px;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-box img {
            height: 48px;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 20px;
            color: white;
        }

        .back-btn {
            background: white;
            color: #2b2b2b;
            border-radius: 30px;
            padding: 8px 22px;
            font-weight: 700;
            text-decoration: none;
        }

        /* ================= PAGE HEADER ================= */
        .page-header {
            margin-top: 30px;
            margin-bottom: 20px;
        }

        .page-header h3 {
            font-weight: 700;
        }

        .page-header p {
            color: #555;
        }

        /* ================= QUIZ CARD ================= */
        .quiz-card {
            background: white;
            border-radius: 18px;
            padding: 22px 26px;
            box-shadow: 0 10px 28px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
            animation: fadeUp 0.8s ease;
        }

        .quiz-card:hover {
            transform: translateY(-6px);
        }

        .quiz-title {
            font-weight: 700;
            font-size: 18px;
        }

        .quiz-meta {
            color: #777;
            font-size: 14px;
        }

        .btn-green {
            background: linear-gradient(120deg, #6fbf4a, #8ed36a);
            color: white;
            border-radius: 30px;
            padding: 10px 24px;
            font-weight: 700;
            border: none;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn-green:hover {
            transform: scale(1.05);
            color: white;
        }

        /* ================= EMPTY STATE ================= */
        .empty-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0,0,0,0.06);
            animation: fadeUp 0.8s ease;
        }

        /* ================= ANIMATION ================= */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ================= RESPONSIVE ================= */
        @media (max-width: 768px) {
            .quiz-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px;
            }

            .logo-box img {
                height: 42px;
            }
        }
    </style>
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-dark">
    <div class="logo-box">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="QuizX Logo">
        <span class="navbar-brand">Available Quizzes</span>
    </div>

    <a href="/student/dashboard" class="back-btn">Dashboard</a>
</nav>

<!-- ================= CONTENT ================= -->
<div class="container">

    <div class="page-header">
        <h3>📋 Live Quizzes</h3>
        <p>Choose a quiz and start attempting</p>
    </div>

    <div class="row g-4">

        {% for quiz in quizzes %}
        <div class="col-12">
            <div class="quiz-card">
                <div>
                    <div class="quiz-title">{{ quiz.title }}</div>
                    <div class="quiz-meta">Status: Live</div>
                </div>

                <a href="/student/quiz/{{ quiz.id }}" class="btn-green">
                    Attempt Quiz
                </a>
            </div>
        </div>
        {% else %}
        <div class="col-12">
            <div class="empty-card">
                <h5>No Quizzes Available</h5>
                <p class="text-muted">
                    There are no live quizzes at the moment.
                </p>
            </div>
        </div>
        {% endfor %}

    </div>

</div>

</body>
</html>
