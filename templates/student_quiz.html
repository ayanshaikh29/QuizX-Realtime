<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuizX | Available Quizzes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/student_quiz.css') }}">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark">
    <div class="logo-box">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="QuizX Logo">
        <span class="navbar-brand">Available Quizzes</span>
    </div>
    <a href="/student/dashboard" class="back-btn">Dashboard</a>
</nav>

<!-- CONTENT -->
<div class="container">
    <div class="page-header">
        <h3>📋 Live Quizzes</h3>
        <p>Choose a quiz and start attempting</p>
    </div>

    <div class="row g-4">
        {% for quiz in quizzes %}
        <div class="col-12">
            <div class="quiz-card">
                <div>
                    <div class="quiz-title">{{ quiz.title }}</div>
                    <div class="quiz-meta">Status: Live</div>
                </div>
                <a href="/student/quiz/{{ quiz.id }}" class="btn-green">
                    Attempt Quiz
                </a>
            </div>
        </div>
        {% else %}
        <div class="col-12">
            <div class="empty-card">
                <h5>No Quizzes Available</h5>
                <p class="text-muted">
                    There are no live quizzes at the moment.
                </p>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

</body>
</html>
