<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizX | Timer Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/add_question.css') }}">
</head>
<body>

<div class="studio-container">
    <header class="studio-header">
        <div class="header-left">
            <a href="/admin/quizzes" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <div>
                <span class="badge" style="color: #3b82f6;">⏱️ Timer-Based Mode</span>
                <h4>{{ quiz.title }}</h4>
            </div>
        </div>
        <div class="header-right">
            {% if not quiz.is_locked %}
            <a href="/admin/end-questions/{{ quiz.id }}" onclick="return confirm('Lock this quiz?')" class="btn-lock">
                <i class="fas fa-lock"></i> Finalize Quiz
            </a>
            {% endif %}
        </div>
    </header>

    <div class="content-wrapper">
        <form method="POST" id="quizForm">
            <div id="questions-container">
                <div class="question-block animate-slide-up">
                    <div class="block-header">
                        <span class="q-number">Question 1</span>
                        <div class="timer-input-group">
                            <i class="fas fa-stopwatch"></i>
                            <input type="number" name="time_0" min="5" value="30" required>
                            <span>sec</span>
                        </div>
                    </div>

                    <div class="block-body">
                        <label>Question Prompt</label>
                        <div class="editor-wrapper">
                            <div class="toolbar">
                                <button type="button" onclick="format('bold')"><i class="fas fa-bold"></i></button>
                                <button type="button" onclick="format('italic')"><i class="fas fa-italic"></i></button>
                                <button type="button" onclick="format('underline')"><i class="fas fa-underline"></i></button>
                            </div>
                            <div class="editor" contenteditable="true" oninput="syncQuestion(this)" data-placeholder="Type your question here..."></div>
                            <input type="hidden" name="question[]">
                        </div>

                        <label class="mt-4">Answer Options</label>
                        <div class="options-grid">
                            {% for i in range(1, 5) %}
                            <div class="option-row">
                                <div class="radio-wrapper">
                                    <input type="radio" name="answer_0" value="{{ i }}" id="q0_opt{{ i }}" required>
                                    <label for="q0_opt{{ i }}" class="check-mark"><i class="fas fa-check"></i></label>
                                </div>
                                <input type="text" name="option{{ i }}_0" placeholder="Option {{ i }}..." required>
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" onclick="addQuestion(true)" class="btn-add"><i class="fas fa-plus"></i> Add Question</button>
                <button type="submit" class="btn-save"><i class="fas fa-cloud-upload-alt"></i> Save Questions</button>
            </div>
        </form>
    </div>
</div>

<script>
let qIndex = 1;
function format(cmd) { document.execCommand(cmd, false, null); }
function syncQuestion(div) { div.nextElementSibling.value = div.innerHTML; }

function addQuestion(hasTimer) {
    const container = document.getElementById("questions-container");
    const clone = container.querySelector(".question-block").cloneNode(true);
    clone.querySelector(".q-number").innerText = `Question ${qIndex + 1}`;
    clone.querySelector(".editor").innerHTML = "";
    clone.querySelectorAll("input").forEach(input => {
        if(input.type === "radio") {
            input.name = `answer_${qIndex}`;
            input.checked = false;
            input.id = `q${qIndex}_opt${input.value}`;
            input.nextElementSibling.setAttribute('for', input.id);
        } else if(input.type === "text") {
            input.name = input.name.replace("_0", `_${qIndex}`);
            input.value = "";
        } else if(input.type === "number") {
            input.name = `time_${qIndex}`;
        }
    });
    container.appendChild(clone);
    qIndex++;
    clone.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
</script>
</body>
</html>
