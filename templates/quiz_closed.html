<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuizX | Quiz Ended</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body{
            min-height:100vh;
            background:linear-gradient(120deg,#f6f8fb,#eef6ea);
            font-family:'Inter',sans-serif;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .closed-card{
            background:white;
            padding:45px 35px;
            border-radius:22px;
            max-width:460px;
            width:100%;
            text-align:center;
            box-shadow:0 20px 45px rgba(0,0,0,0.1);
            animation:fadeUp 0.7s ease;
        }

        .icon{
            font-size:60px;
            margin-bottom:15px;
        }

        h3{
            font-weight:700;
            margin-bottom:10px;
        }

        p{
            color:#555;
            margin-bottom:25px;
        }

        .btn-green{
            background:linear-gradient(120deg,#6fbf4a,#8ed36a);
            color:white;
            font-weight:700;
            border-radius:30px;
            padding:12px 28px;
            border:none;
            transition:0.3s;
            text-decoration:none;
            display:inline-block;
        }

        .btn-green:hover{
            transform:scale(1.05);
            color:white;
        }

        .btn-outline{
            border:2px solid #6fbf4a;
            color:#6fbf4a;
            font-weight:600;
            border-radius:30px;
            padding:10px 26px;
            text-decoration:none;
            margin-top:12px;
            display:inline-block;
        }

        @keyframes fadeUp{
            from{opacity:0;transform:translateY(20px);}
            to{opacity:1;transform:translateY(0);}
        }
    </style>
</head>

<body>

<div class="closed-card">

    <!-- ICON -->
    <div class="icon">⏰</div>

    <!-- TITLE -->
    <h3>Quiz Session Ended</h3>

    <!-- MESSAGE FROM BACKEND -->
    <p>
        {{ message if message else "This quiz is no longer accepting responses." }}
    </p>

    <!-- ACTIONS -->
    <a href="/student/dashboard" class="btn-green">
        Go to Dashboard
    </a>

    <br>

    <a href="/join" class="btn-outline">
        Join Another Quiz
    </a>

</div>

</body>
</html>
