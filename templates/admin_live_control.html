<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizX Admin | Live Command Center</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_live_control.css') }}">
</head>
<body>

<div class="sidebar">
    <a href="#" class="brand-logo"><i class="fas fa-bolt"></i> QuizX Admin</a>
    <ul class="nav-menu">
        <li class="nav-item"><a href="/admin/dashboard" class="nav-link"><i class="fas fa-th-large"></i> Dashboard</a></li>
        <li class="nav-item"><a href="/admin/quizzes" class="nav-link active"><i class="fas fa-list-ul"></i> Quizzes</a></li>
    </ul>
    <a href="/logout" class="nav-link logout-link text-danger mt-auto"><i class="fas fa-sign-out-alt"></i> Logout</a>
</div>

<div class="main-wrapper">
    <header class="page-header animate__animated animate__fadeInDown">
        <div class="header-title">
            <h2>Live Command Center</h2>
            <p>Managing: <b>{{ quiz.title }}</b></p>
        </div>
        <div class="user-avatar">AD</div>
    </header>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="glass-card">
                <h5 class="fw-bold mb-4">Connection</h5>
                <div class="copy-box">
                    <label>Join Code</label>
                    <div class="copy-inner">
                        <span class="fw-bold fs-4">{{ quiz.join_code }}</span>
                        <button class="btn-icon" title="Copy Code" onclick="copyText('{{ quiz.join_code }}')">
                            <i class="far fa-copy"></i>
                        </button>
                    </div>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted fw-bold">Active Players</span>
                    <span class="fw-bold text-success" id="playerCount">0</span>
                </div>
                <div class="progress" style="height: 8px;">
                    <div id="progressBar" class="progress-bar bg-success" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="glass-card mb-4">
                <div class="text-center">
                    <div class="status-pill"><span class="pulse-dot"></span> LIVE SESSION</div>
                    <h1 class="display-4 fw-bold" id="qCounterDisplay">{{ current_index + 1 }} / {{ total_questions }}</h1>
                    <div class="row justify-content-center mt-4">
                        <div class="col-md-6">
                            <button id="nextBtn" class="btn-live-control" onclick="nextQuestion()">
                                NEXT QUESTION <i class="fas fa-chevron-right ms-2"></i>
                            </button>
                            <button class="btn-stop" onclick="endQuiz()">STOP SESSION</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="glass-card">
                <h5 class="fw-bold mb-4 text-success"><i class="fas fa-trophy me-2"></i> Real-time Leaderboard</h5>
                <div id="leaderboardList">
                    <div class="text-center py-4 text-muted">Connecting to session...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    const socket = io();
    const quizId = {{ quiz.id }};
    const totalQuestions = {{ total_questions }};
    let currentIndex = {{ current_index }};

    socket.emit("join_quiz", { quiz_id: quizId });

    // Initial load
    fetch('/api/leaderboard/' + quizId)
        .then(res => res.json())
        .then(data => renderLeaderboard(data.leaderboard || data))
        .catch(err => console.error("Initial fetch failed:", err));

    function copyText(text) {
        navigator.clipboard.writeText(text);
        const icon = document.querySelector('.btn-icon i');
        icon.className = 'fas fa-check text-success';
        setTimeout(() => icon.className = 'far fa-copy', 2000);
    }

    function updateProgress() {
        const percent = ((currentIndex + 1) / totalQuestions) * 100;
        document.getElementById('progressBar').style.width = percent + '%';
        document.getElementById("qCounterDisplay").innerText = `${currentIndex + 1} / ${totalQuestions}`;
        
        if (currentIndex >= totalQuestions - 1) {
            const btn = document.getElementById("nextBtn");
            btn.disabled = true;
            btn.innerText = "FINISH QUIZ";
            btn.onclick = endQuiz; // Change behavior for last step
        }
    }
    updateProgress();

    function nextQuestion() {
        if (currentIndex < totalQuestions - 1) {
            currentIndex++;
            updateProgress();
            socket.emit("admin_next_question", { 
                quiz_id: quizId, 
                new_index: currentIndex 
            });
        }
    }

    function endQuiz() {
        if (confirm("End the session for all students? This will redirect everyone to the final results.")) {
            socket.emit("quiz_finished", { quiz_id: quizId });
            window.location.href = "/admin/quizzes";
        }
    }

    function renderLeaderboard(data) {
        const list = document.getElementById("leaderboardList");
        const countSpan = document.getElementById("playerCount");
        
        const students = Array.isArray(data) ? data : [];
        countSpan.innerText = students.length;

        if (students.length === 0) {
            list.innerHTML = `<div class="text-center py-4 text-muted">No players joined yet.</div>`;
            return;
        }

        list.innerHTML = "";
        students.sort((a, b) => b.points - a.points);

        students.forEach((p, i) => {
            list.innerHTML += `
                <div class="leader-item animate__animated animate__fadeInRight" style="animation-delay: ${i * 0.05}s">
                    <div class="rank-badge">${i + 1}</div>
                    <div class="flex-grow-1 fw-bold">${p.student}</div>
                    <div class="fw-bold text-success">${p.points} pts</div>
                </div>
            `;
        });
    }

    socket.on("leaderboard_update", (data) => {
        renderLeaderboard(data);
    });
</script>
</body>
</html>
