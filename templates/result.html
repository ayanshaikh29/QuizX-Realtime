<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuizX | Result</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/result.css') }}">
</head>
<body>

<!-- HEADER -->
<div class="page-header text-center">
    <h4>🎉 Quiz Completed</h4>
    <p class="mb-0">Here is your result</p>
</div>

<div class="container mt-5">
    <div class="result-card mx-auto" style="max-width: 500px;">
        <h3 class="fw-bold mb-3">Your Score</h3>
        <div class="score">
            {{ score }} <small>/ {{ total }}</small>
        </div>

        <!-- PROGRESS -->
        <div class="progress">
            <div class="progress-bar" role="progressbar" style="width: {{ (score / total) * 100 }}%;"></div>
        </div>

        <p class="mt-3 text-muted">
            You answered {{ score }} out of {{ total }} questions correctly.
        </p>

        <!-- ACTIONS -->
        <div class="d-flex justify-content-center gap-3 mt-4 flex-wrap">
            <a href="/student/dashboard" class="btn-outline-green">Dashboard</a>
            <a href="/student/quizzes" class="btn-green">Attempt Another Quiz</a>
        </div>
    </div>
</div>

</body>
</html>
