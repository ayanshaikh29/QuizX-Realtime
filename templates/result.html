<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuizX | Result</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: #f6f8fb;
            font-family: 'Inter', sans-serif;
        }

        /* ================= HEADER ================= */
        .page-header {
            background: linear-gradient(120deg, #6fbf4a, #8ed36a);
            color: white;
            padding: 30px;
            border-radius: 0 0 22px 22px;
            animation: fadeDown 0.6s ease;
        }

        .page-header h4 {
            font-weight: 700;
        }

        /* ================= RESULT CARD ================= */
        .result-card {
            background: white;
            border-radius: 22px;
            padding: 40px;
            box-shadow: 0 14px 35px rgba(0,0,0,0.07);
            animation: popIn 0.8s ease;
            text-align: center;
        }

        .score {
            font-size: 64px;
            font-weight: 800;
            color: #6fbf4a;
        }

        .score small {
            font-size: 22px;
            color: #777;
        }

        /* ================= PROGRESS BAR ================= */
        .progress {
            height: 14px;
            border-radius: 10px;
            margin-top: 25px;
        }

        .progress-bar {
            background: linear-gradient(120deg, #6fbf4a, #8ed36a);
        }

        /* ================= BUTTONS ================= */
        .btn-green {
            background: linear-gradient(120deg, #6fbf4a, #8ed36a);
            color: white;
            font-weight: 700;
            border-radius: 30px;
            padding: 12px 32px;
            border: none;
            transition: 0.3s;
        }

        .btn-green:hover {
            transform: scale(1.05);
        }

        .btn-outline-green {
            border: 2px solid #6fbf4a;
            color: #6fbf4a;
            font-weight: 700;
            border-radius: 30px;
            padding: 10px 30px;
            background: transparent;
        }

        /* ================= ANIMATIONS ================= */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ================= RESPONSIVE ================= */
        @media (max-width: 768px) {
            .score {
                font-size: 48px;
            }
        }
    </style>
</head>

<body>

<!-- ================= HEADER ================= -->
<div class="page-header text-center">
    <h4>🎉 Quiz Completed</h4>
    <p class="mb-0">Here is your result</p>
</div>

<div class="container mt-5">

    <div class="result-card mx-auto" style="max-width: 500px;">

        <h3 class="fw-bold mb-3">Your Score</h3>

        <div class="score">
            {{ score }} <small>/ {{ total }}</small>
        </div>

        <!-- PROGRESS -->
        <div class="progress">
            <div class="progress-bar"
                 role="progressbar"
                 style="width: {{ (score / total) * 100 }}%;">
            </div>
        </div>

        <p class="mt-3 text-muted">
            You answered {{ score }} out of {{ total }} questions correctly.
        </p>

        <!-- ACTIONS -->
        <div class="d-flex justify-content-center gap-3 mt-4 flex-wrap">
            <a href="/student/dashboard" class="btn-outline-green">
                Dashboard
            </a>
            <a href="/student/quizzes" class="btn-green">
                Attempt Another Quiz
            </a>
        </div>

    </div>

</div>

</body>
</html>
