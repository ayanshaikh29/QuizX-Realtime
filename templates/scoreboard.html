<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuizX | Live Leaderboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/scoreboard.css') }}">
</head>
<body>

<!-- HEADER -->
<div class="leaderboard-header">
    <h3>
        <span class="live-dot"></span>
        Live Leaderboard
    </h3>
    <p class="mb-0">Real-time quiz rankings</p>
</div>

<div class="container mt-5 mb-5">
    <div class="leaderboard-card">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Student</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody>
                {% for r in results %}
                    <tr class="{% if loop.index == 1 %}rank-1{% elif loop.index == 2 %}rank-2{% elif loop.index == 3 %}rank-3{% endif %}">
                        <td>
                            {% if loop.index == 1 %}🥇{% elif loop.index == 2 %}🥈{% elif loop.index == 3 %}🥉{% else %}{{ loop.index }}{% endif %}
                        </td>
                        <td>{{ r.student }}</td>
                        <td>
                            <span class="score-badge">{{ r.score }} / {{ r.total }}</span>
                        </td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    setInterval(() => {
        location.reload();
    }, 5000); // refresh every 5 sec
</script>

</body>
</html>
