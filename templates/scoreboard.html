<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuizX | Live Leaderboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: #f6f8fb;
            font-family: 'Inter', sans-serif;
        }

        /* ================= HEADER ================= */
        .leaderboard-header {
            background: linear-gradient(120deg, #6fbf4a, #8ed36a);
            color: white;
            padding: 28px;
            border-radius: 0 0 22px 22px;
            text-align: center;
            animation: fadeDown 0.6s ease;
        }

        .leaderboard-header h3 {
            font-weight: 700;
        }

        /* ================= CARD ================= */
        .leaderboard-card {
            background: white;
            border-radius: 22px;
            padding: 25px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.06);
            animation: fadeUp 0.8s ease;
        }

        /* ================= TABLE ================= */
        table {
            border-collapse: separate;
            border-spacing: 0 12px;
        }

        thead th {
            background: #e8f5e1 !important;
            color: #166534;
            border: none;
            font-weight: 700;
            text-align: center;
        }

        tbody tr {
            background: #ffffff;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
            border-radius: 14px;
            transition: 0.3s;
        }

        tbody tr:hover {
            transform: scale(1.02);
        }

        tbody td {
            border: none;
            text-align: center;
            vertical-align: middle;
            font-weight: 600;
        }

        /* ================= RANK BADGES ================= */
        .rank-1 {
            background: linear-gradient(120deg, #fde047, #facc15);
            font-weight: 800;
        }

        .rank-2 {
            background: linear-gradient(120deg, #e5e7eb, #d1d5db);
            font-weight: 800;
        }

        .rank-3 {
            background: linear-gradient(120deg, #fdba74, #fb923c);
            font-weight: 800;
        }

        .score-badge {
            background: #ecfdf5;
            color: #065f46;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
        }

        /* ================= LIVE DOT ================= */
        .live-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: red;
            border-radius: 50%;
            animation: pulse 1s infinite;
            margin-right: 8px;
        }

        /* ================= ANIMATIONS ================= */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.6; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ================= RESPONSIVE ================= */
        @media (max-width: 768px) {
            tbody td {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<!-- ================= HEADER ================= -->
<div class="leaderboard-header">
    <h3>
        <span class="live-dot"></span>
        Live Leaderboard
    </h3>
    <p class="mb-0">Real-time quiz rankings</p>
</div>

<div class="container mt-5 mb-5">

    <div class="leaderboard-card">

        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Student</th>
                        <th>Score</th>
                    </tr>
                </thead>

                <tbody>
                {% for r in results %}
                    <tr class="
                        {% if loop.index == 1 %}rank-1{% endif %}
                        {% if loop.index == 2 %}rank-2{% endif %}
                        {% if loop.index == 3 %}rank-3{% endif %}
                    ">
                        <td>
                            {% if loop.index == 1 %}🥇{% elif loop.index == 2 %}🥈{% elif loop.index == 3 %}🥉{% else %}{{ loop.index }}{% endif %}
                        </td>
                        <td>{{ r.student }}</td>
                        <td>
                            <span class="score-badge">
                                {{ r.score }} / {{ r.total }}
                            </span>
                        </td>
                    </tr>
                {% endfor %}
                </tbody>

            </table>
        </div>

    </div>

</div>

</body>
</html>
<script>
setInterval(() => {
    location.reload();
}, 5000); // refresh every 5 sec
</script>
