<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizX | Final Leaderboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_live_leaderboard.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.07);
        }

        .text-gradient {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .final-status {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.95)) !important;
            border: 1px solid rgba(226, 232, 240, 0.8) !important;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06) !important;
        }

        .btn-view-answer {
            background: linear-gradient(135deg, #1e293b, #334155);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 8px 25px rgba(30, 30, 30, 0.2);
            transition: 0.3s ease;
        }

        .btn-view-answer:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(30, 30, 30, 0.4);
            color: white;
        }
    </style>
</head>

<body>

    <div class="leaderboard-container">
        <header class="leaderboard-header">
            <button class="back-btn" onclick="window.location.href='{{ url_for('student.dashboard') }}'">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="header-title">
                <h2 class="animate__animated animate__fadeInDown">Global Rankings</h2>
                <p class="animate__animated animate__fadeInUp">Final Results</p>
            </div>
        </header>

        <div class="container-fluid p-4">
            <div class="status-container animate__animated animate__zoomIn">
                <div class="status-banner final-status glass-panel">
                    <i class="fas fa-trophy text-warning"
                        style="font-size: 2.5rem; filter: drop-shadow(0 0 10px rgba(255,193,7,0.5));"></i>
                    <div class="ms-3">
                        <div class="status-title fs-3 fw-bold text-gradient">Quiz Complete!</div>
                        <div class="status-subtitle text-muted">Here are the final standings</div>
                    </div>
                </div>
            </div>

            <div class="podium-section mt-5" id="podiumContainer"></div>
            <div class="list-section mt-4 glass-panel p-4 rounded-4" id="playerList"></div>

            <div class="text-center mt-5 mb-4 animate__animated animate__fadeInUp" style="animation-delay: 0.5s;">
                <a href="{{ url_for('student.review_quiz', quiz_id=quiz_id) }}" class="btn btn-view-answer">
                    <i class="fas fa-search me-2"></i> Review My Performance
                </a>
            </div>
        </div>
    </div>

    <script>
        const quizId = {{ quiz_id }};
        const currentStudent = "{{ session.get('username') }}";

        function getInitials(name) {
            return name ? name.substring(0, 2).toUpperCase() : '?';
        }

        function renderLeaderboard(leaderboard) {

            leaderboard.sort((a, b) => {
                if (b.correct !== a.correct) return b.correct - a.correct;
                if (a.time !== b.time) return a.time - b.time;
                return b.points - a.points;
            });

            const top3 = leaderboard.slice(0, 3);
            const others = leaderboard.slice(3);

            renderPodium(top3);
            renderOthers(others, 4);
        }

        function renderPodium(top3) {
            const container = document.getElementById("podiumContainer");
            container.innerHTML = "";

            let displayOrder = [];
            if (top3.length === 1)
                displayOrder = [{ data: top3[0], class: 'first', rank: 1 }];
            else if (top3.length === 2)
                displayOrder = [
                    { data: top3[1], class: 'second', rank: 2 },
                    { data: top3[0], class: 'first', rank: 1 }
                ];
            else
                displayOrder = [
                    { data: top3[1], class: 'second', rank: 2 },
                    { data: top3[0], class: 'first', rank: 1 },
                    { data: top3[2], class: 'third', rank: 3 }
                ];

            displayOrder.forEach(pos => {
                if (!pos.data) return;
                const p = pos.data;

                container.innerHTML += `
        <div class="podium-item ${pos.class}">
            ${pos.rank === 1 ? '<div class="crown-icon"><i class="fas fa-crown"></i></div>' : ''}
            <div class="avatar-wrapper">
                <div class="podium-avatar avatar-grad-1">${getInitials(p.student)}</div>
                <div class="rank-badge">${pos.rank}</div>
            </div>
            <div class="podium-name">${p.student}</div>
            <div class="podium-points">${p.correct} Correct • ${p.time}s</div>
        </div>`;
            });
        }

        function renderOthers(players, startRank) {
            const container = document.getElementById("playerList");
            container.innerHTML = "";
            players.forEach((p, i) => {
                container.innerHTML += `
        <div class="player-row ${p.student === currentStudent ? 'current-user' : ''}">
            <div class="row-rank">${startRank + i}</div>
            <div class="row-avatar avatar-grad-2">${getInitials(p.student)}</div>
            <div class="row-info">
                <div class="row-name">${p.student}</div>
            </div>
            <div class="row-points">${p.correct} Correct • ${p.time}s</div>
        </div>`;
            });
        }

        fetch(`/student/api/leaderboard/${quizId}`)
            .then(r => r.json())
            .then(data => renderLeaderboard(data.leaderboard))
            .catch(err => console.error(err));

    </script>
</body>

</html>
