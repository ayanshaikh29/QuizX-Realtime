<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizX | Final Leaderboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/live_leaderboard.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
.btn-view-answer {
    background: linear-gradient(135deg,#6fbf4a,#4ade80);
    color: white;
    border: none;
    padding: 14px 30px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 1.1rem;
    box-shadow: 0 8px 25px rgba(111,191,74,0.4);
    transition: 0.3s ease;
    animation: pulseGlow 2s infinite;
}
.btn-view-answer:hover {
    transform: translateY(-4px);
    box-shadow: 0 15px 35px rgba(111,191,74,0.6);
    color:white;
}
@keyframes pulseGlow {
    0% { box-shadow:0 0 0 0 rgba(111,191,74,0.4);}
    70% { box-shadow:0 0 0 20px rgba(111,191,74,0);}
    100% { box-shadow:0 0 0 0 rgba(111,191,74,0);}
}
</style>
</head>

<body>

<div class="leaderboard-container">

<header class="leaderboard-header">
    <button class="back-btn" onclick="window.location.href='{{ url_for('student.dashboard') }}'">
        <i class="fas fa-arrow-left"></i>
    </button>
    <div class="header-title">
        <h2>Final Leaderboard</h2>
    </div>
</header>

<div class="container-fluid p-4">

<div class="status-container">
    <div class="status-banner final-status">
        <i class="fas fa-trophy"></i>
        <div>
            <div class="status-title">Quiz is Over!</div>
            <div class="status-subtitle">Here are the final rankings</div>
        </div>
    </div>
</div>

<div class="podium-section" id="podiumContainer"></div>
<div class="list-section" id="playerList"></div>

<div class="text-center mt-5">
    <a href="{{ url_for('student.review_quiz', quiz_id=quiz_id) }}" class="btn-view-answer">
        <i class="fas fa-eye me-2"></i> View My Answers
    </a>
</div>

</div>
</div>

<script>
const quizId = {{ quiz_id }};
const currentStudent = "{{ session.get('username') }}";

function getInitials(name){
    return name ? name.substring(0,2).toUpperCase() : '?';
}

function renderLeaderboard(leaderboard){

    leaderboard.sort((a,b)=>{
        if(b.correct !== a.correct) return b.correct - a.correct;
        if(a.time !== b.time) return a.time - b.time;
        return b.points - a.points;
    });

    const top3 = leaderboard.slice(0,3);
    const others = leaderboard.slice(3);

    renderPodium(top3);
    renderOthers(others,4);
}

function renderPodium(top3){
    const container = document.getElementById("podiumContainer");
    container.innerHTML="";

    let displayOrder=[];
    if(top3.length===1)
        displayOrder=[{data:top3[0],class:'first',rank:1}];
    else if(top3.length===2)
        displayOrder=[
            {data:top3[1],class:'second',rank:2},
            {data:top3[0],class:'first',rank:1}
        ];
    else
        displayOrder=[
            {data:top3[1],class:'second',rank:2},
            {data:top3[0],class:'first',rank:1},
            {data:top3[2],class:'third',rank:3}
        ];

    displayOrder.forEach(pos=>{
        if(!pos.data) return;
        const p=pos.data;

        container.innerHTML+=`
        <div class="podium-item ${pos.class}">
            ${pos.rank===1?'<div class="crown-icon"><i class="fas fa-crown"></i></div>':''}
            <div class="avatar-wrapper">
                <div class="podium-avatar avatar-grad-1">${getInitials(p.student)}</div>
                <div class="rank-badge">${pos.rank}</div>
            </div>
            <div class="podium-name">${p.student}</div>
            <div class="podium-points">${p.correct} Correct • ${p.time}s</div>
        </div>`;
    });
}

function renderOthers(players,startRank){
    const container=document.getElementById("playerList");
    container.innerHTML="";
    players.forEach((p,i)=>{
        container.innerHTML+=`
        <div class="player-row ${p.student===currentStudent?'current-user':''}">
            <div class="row-rank">${startRank+i}</div>
            <div class="row-avatar avatar-grad-2">${getInitials(p.student)}</div>
            <div class="row-info">
                <div class="row-name">${p.student}</div>
            </div>
            <div class="row-points">${p.correct} Correct • ${p.time}s</div>
        </div>`;
    });
}

fetch(`/student/api/leaderboard/${quizId}`)
.then(r=>r.json())
.then(data=>renderLeaderboard(data.leaderboard))
.catch(err=>console.error(err));

</script>
</body>
</html>
