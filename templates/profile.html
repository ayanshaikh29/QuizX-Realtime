<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuizX | Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Profile CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
</head>
<body>

<!-- HEADER -->
<div class="profile-header text-center">
    <h4>👤 My Profile</h4>
    <p class="mb-0">Manage your account information</p>
</div>

<div class="container mt-5">

    <div class="profile-card mx-auto">

        <!-- AVATAR -->
        <div class="avatar">
            {{ user.username[0]|upper }}
        </div>

        <h5 class="fw-bold mt-3">{{ user.username }}</h5>
        <p class="text-muted">{{ user.email }}</p>

        <hr>

        <!-- INFO -->
        <div class="info-row">
            <span>Role</span>
            <span class="badge bg-success">{{ user.role|capitalize }}</span>
        </div>

        <div class="info-row">
            <span>Joined</span>
            <span>{{ user.created_at.strftime('%d %b %Y') if user.created_at else '—' }}</span>
        </div>

        <!-- ACTIONS -->
        <div class="mt-4 d-grid gap-2">
            <a href="{{ url_for('profile') }}" class="btn btn-outline-success">
                ✏ Edit Profile
            </a>
            <a href="{{ url_for('logout') }}" class="btn btn-danger">
                🚪 Logout
            </a>
        </div>

    </div>

</div>

</body>
</html>
