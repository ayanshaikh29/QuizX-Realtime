<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuizX | Attempt Quiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/attempt_quiz.css') }}">
</head>
<body>

<!-- HEADER -->
<div class="page-header text-center">
    <h4>🧠 Live Quiz</h4>
    <p class="mb-0">Answer before time runs out</p>
</div>

<div class="container mt-4 mb-5">

    {% if paused %}
    <div class="alert alert-warning text-center fw-bold">
        ⏸ Quiz Paused by Admin<br>
        Please wait...
    </div>
    <script>
        setTimeout(() => location.reload(), 5000);
    </script>
    {% else %}

    <div class="timer-box">
        ⏱ Time Left: <span id="timer">--:--</span>
    </div>

    <form method="POST">
        {% for q in questions %}
        <div class="question-card">
            <div class="question-text">
                {{ loop.index }}. {{ q.question }}
            </div>

            <label class="option">
                <input type="radio" name="{{ q.id }}" value="{{ q.option1 }}" required>
                {{ q.option1 }}
            </label>
            <label class="option">
                <input type="radio" name="{{ q.id }}" value="{{ q.option2 }}">
                {{ q.option2 }}
            </label>
            <label class="option">
                <input type="radio" name="{{ q.id }}" value="{{ q.option3 }}">
                {{ q.option3 }}
            </label>
            <label class="option">
                <input type="radio" name="{{ q.id }}" value="{{ q.option4 }}">
                {{ q.option4 }}
            </label>
        </div>
        {% endfor %}

        <div class="submit-bar">
            <button class="btn-green">🚀 Submit Quiz</button>
        </div>
    </form>
    {% endif %}
</div>

{% if not paused %}
<script>
let time = {{ remaining_seconds | default(0) }};
const timerEl = document.getElementById("timer");

const interval = setInterval(() => {
    if (time <= 0) {
        clearInterval(interval);
        alert("⏰ Time over! Quiz auto-submitted.");
        document.querySelector("form").submit();
    }

    let m = Math.floor(time / 60);
    let s = time % 60;
    timerEl.innerText = `${m}:${s.toString().padStart(2,'0')}`;
    time--;
}, 1000);
</script>
{% endif %}

</body>
</html>
