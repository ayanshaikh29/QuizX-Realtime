<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizX | {{ quiz.title }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --lime: #c5f82a;
            --lime-dark: #a8d620;
            --surface: rgba(255, 255, 255, 0.95);
            --text-main: #111827;
            --text-muted: #6b7280;
            --dark: #1e293b;
            --danger: #ef4444;
            --success: #10b981;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #f0fdf4 50%, #ecfdf5 100%);
            min-height: 100vh;
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Navigation */
        .nav-floater {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 100px;
            padding: 0.8rem 1.5rem;
            margin-top: 1.5rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        
        .brand-text { 
            font-weight: 800; 
            font-size: 1.4rem; 
            letter-spacing: -0.5px; 
        }
        
        .brand-text span { 
            color: var(--primary); 
        }

        /* Timer Badge */
        .timer-badge {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-radius: 100px;
            padding: 0.5rem 1.2rem;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            animation: timerPulse 2s infinite;
        }

        @keyframes timerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .timer-badge.warning {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            animation: timerWarning 1s infinite;
        }

        @keyframes timerWarning {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .timer-badge.danger {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            animation: timerDanger 0.5s infinite;
        }

        @keyframes timerDanger {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Quiz Container */
        .quiz-container { 
            max-width: 900px; 
            margin: 2rem auto; 
            padding: 0 1rem; 
        }

        .question-card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            border-radius: 2.5rem;
            padding: 3rem;
            box-shadow: 0 10px 40px -10px rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(255,255,255,0.8);
            position: relative;
            overflow: hidden;
            animation: cardAppear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardAppear {
            from { 
                opacity: 0; 
                transform: translateY(30px) scale(0.95); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }

        /* Timer Progress Bar */
        .timer-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: #e5e7eb;
            border-radius: 2.5rem 2.5rem 0 0;
            overflow: hidden;
        }

        .timer-progress {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--lime));
            transition: width 1s linear;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        .question-title {
            font-weight: 800; 
            font-size: 2rem; 
            line-height: 1.4;
            margin: 2.5rem 0; 
            color: var(--text-main);
            text-align: center;
            animation: textReveal 0.8s ease;
        }

        @keyframes textReveal {
            from { 
                opacity: 0; 
                transform: translateY(20px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }

        /* Options Grid */
        .options-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 1.25rem; 
        }

        @media (max-width: 768px) {
            .options-grid { 
                grid-template-columns: 1fr; 
            }
        }

        .option-label { 
            cursor: pointer; 
            position: relative; 
        }

        .option-content {
            background: white;
            border: 2px solid #e5e7eb;
            padding: 1.5rem;
            border-radius: 1.25rem;
            display: flex; 
            align-items: center; 
            gap: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .option-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        }

        .option-label:hover .option-content {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-color: var(--primary);
        }

        .option-label:hover .option-content::before {
            animation: slideShine 0.6s ease;
        }

        @keyframes slideShine {
            to { transform: translateX(100%); }
        }

        .option-key {
            width: 46px;
            height: 46px;
            background: #f3f4f6;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: var(--text-muted);
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .option-text {
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--text-main);
            flex: 1;
        }

        .option-label input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .option-label input:checked + .option-content {
            border-color: var(--primary);
            background: #ecfdf5;
            transform: scale(1.02);
            animation: optionSelect 0.4s ease;
        }

        @keyframes optionSelect {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1.02); }
        }

        .option-label input:checked + .option-content .option-key {
            background: var(--primary);
            color: white;
        }

        /* Answer Feedback */
        .option-content.correct {
            border-color: var(--success) !important;
            background: #d1fae5 !important;
            animation: correctPulse 0.6s ease;
        }

        .option-content.correct .option-key {
            background: var(--success) !important;
            color: white !important;
        }

        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .option-content.incorrect {
            border-color: var(--danger) !important;
            background: #fee2e2 !important;
            animation: incorrectShake 0.5s ease;
        }

        .option-content.incorrect .option-key {
            background: var(--danger) !important;
            color: white !important;
        }

        @keyframes incorrectShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Submit Button */
        .btn-submit {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 1rem 3rem;
            border-radius: 100px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
            letter-spacing: 0.5px;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(16, 185, 129, 0.4);
        }

        .btn-submit:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Result Banner */
        .result-banner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 3rem 4rem;
            border-radius: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            z-index: 10000;
            text-align: center;
            min-width: 400px;
        }

        .result-banner.correct {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
        }

        .result-banner.incorrect {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: white;
        }

        .result-banner h3 {
            font-size: 2.5rem;
            font-weight: 900;
            margin: 1rem 0;
        }

        .result-banner .result-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .result-banner.correct .result-icon {
            color: white;
        }

        .result-banner.incorrect .result-icon {
            color: white;
        }

        /* Badge Styles */
        .badge {
            font-weight: 700;
            font-size: 0.875rem;
            padding: 0.5rem 1.2rem;
            border-radius: 100px;
            letter-spacing: 0.5px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .question-card {
                padding: 2rem 1.5rem;
                border-radius: 2rem;
            }
            
            .question-title {
                font-size: 1.5rem;
            }
            
            .result-banner {
                min-width: 90%;
                padding: 2rem;
            }
            
            .result-banner h3 {
                font-size: 2rem;
            }
            
            .btn-submit {
                width: 100%;
                padding: 1rem 2rem;
            }
        }

        /* Loading Spinner */
        .spinner-border {
            width: 1rem;
            height: 1rem;
            border-width: 2px;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center sticky-top" style="z-index: 100;" id="quizNav">
    <nav class="nav-floater d-flex justify-content-between align-items-center w-100">
        <div class="brand-text">Quiz<span>X</span></div>
        <div class="d-flex align-items-center gap-3">
            <div class="timer-badge" id="timerBadge">
                <i class="fas fa-clock me-2"></i>
                <span id="timerLabel">{{ current_question.time_limit }}s</span>
            </div>
            <div class="bg-dark text-white rounded-pill px-3 py-1 fw-bold fs-7">
                {{ current_index + 1 }} / {{ total_questions }}
            </div>
        </div>
    </nav>
</div>

<div class="quiz-container animate__animated animate__fadeInUp" id="attemptPage">
    <div class="question-card mt-4">
        <div class="timer-bar">
            <div id="progressBar" class="timer-progress"></div>
        </div>

        <div class="text-center mt-3">
            <span class="badge bg-success bg-opacity-10 text-success px-3 py-2 rounded-pill">
                <i class="fas fa-bolt me-1"></i> LIVE QUIZ
            </span>
        </div>
        <h1 class="question-title text-center">{{ current_question.question | safe }}</h1>

        <form id="quizForm">
            <div class="options-grid mt-4">
                {% for opt in [current_question.option1, current_question.option2, current_question.option3, current_question.option4] %}
                <label class="option-label animate__animated animate__zoomIn" style="animation-delay: {{ loop.index0 * 0.1 }}s">
                    <input type="radio" name="answer" value="{{ opt }}" data-option="{{ opt }}">
                    <div class="option-content" data-option="{{ opt }}">
                        <div class="option-key">{{ ["A", "B", "C", "D"][loop.index0] }}</div>
                        <div class="option-text">{{ opt }}</div>
                    </div>
                </label>
                {% endfor %}
            </div>

            <div class="text-center mt-5">
                <button type="button" id="submitBtn" class="btn-submit">
                    <i class="fas fa-paper-plane me-2"></i>SUBMIT ANSWER
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    const socket = io();
    const quizId = {{ quiz.id }};
    const user = "{{ session.get('username', 'Guest') }}";
    const curIdx = {{ current_index }};
    const totalQs = {{ total_questions }};
    const correctAnswer = "{{ current_question.correct_answer }}";

    let timeLimit = {{ current_question.time_limit }};
    let timeLeft = timeLimit;
    let submitted = false;
    let timerTick = null;
    let questionStartTime = Date.now();
    let isLastQuestion = (curIdx === totalQs - 1);

    console.log('=== QUIZ INITIALIZED ===');
    console.log('Quiz ID:', quizId);
    console.log('Current User:', user);
    console.log('Question Index:', curIdx);
    console.log('Total Questions:', totalQs);
    console.log('Is Last Question:', isLastQuestion);
    console.log('Time Limit:', timeLimit, 'seconds');

    // Socket.IO connection
    socket.emit("join_quiz", { quiz_id: quizId });
    console.log('📡 Joined quiz room:', quizId);

    // Socket connection status
    socket.on('connect', () => {
        console.log('✅ Connected to Socket.IO server');
    });

    socket.on('disconnect', () => {
        console.log('⚠️ Disconnected from Socket.IO server');
    });

    socket.on('connect_error', (error) => {
        console.error('❌ Socket.IO connection error:', error);
    });

    // Listen for admin moving to next question (shouldn't happen on quiz page, but just in case)
    socket.on("load_next_question", (data) => {
        if (parseInt(data.quiz_id) !== quizId) return;
        console.log('📢 Admin moved to next question:', data.qindex);
        clearInterval(timerTick);
        // If we're on the quiz page when this happens, redirect to that question
        window.location.href = `/student/quiz/${data.quiz_id}?qindex=${data.qindex}`;
    });

    // Listen for quiz finished event
    socket.on("quiz_finished", (data) => {
        console.log('🏁 Quiz finished event received');
        clearInterval(timerTick);
        // If quiz finishes while we're on a question, redirect to final leaderboard
        if (submitted) {
            setTimeout(() => {
                window.location.href = `/student/leaderboard/live/${quizId}?qindex=done`;
            }, 500);
        }
    });

    function startTimer() {
        if (timerTick) clearInterval(timerTick);
        
        timerTick = setInterval(() => {
            if (submitted) {
                clearInterval(timerTick);
                return;
            }
            
            timeLeft--;
            const label = document.getElementById("timerLabel");
            const badge = document.getElementById("timerBadge");
            const bar = document.getElementById("progressBar");
            
            if (label) label.innerText = Math.max(0, timeLeft) + "s";
            if (bar) {
                const percentage = (timeLeft / timeLimit) * 100;
                bar.style.width = Math.max(0, percentage) + "%";
            }
            
            // Update timer badge color based on time left
            if (badge) {
                badge.classList.remove('warning', 'danger');
                if (timeLeft <= 5) {
                    badge.classList.add('danger');
                } else if (timeLeft <= 10) {
                    badge.classList.add('warning');
                }
            }
            
            if (timeLeft <= 0) {
                clearInterval(timerTick);
                if (!submitted) handleSubmission("No Answer");
            }
        }, 1000);
    }

    startTimer();

    document.getElementById("submitBtn").onclick = () => {
        const sel = document.querySelector("input[name='answer']:checked");
        if (!sel && !submitted) {
            alert("Please select an answer!");
            return;
        }
        handleSubmission(sel.value);
    };

    function handleSubmission(val = "No Answer") {
        if (submitted) return;
        submitted = true;
        clearInterval(timerTick);

        const btn = document.getElementById("submitBtn");
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Submitting...`;

        // Disable all radio buttons
        document.querySelectorAll("input[name='answer']").forEach(i => i.disabled = true);

        const actualTimeTaken = Math.floor((Date.now() - questionStartTime) / 1000);
        const finalTime = Math.min(actualTimeTaken, timeLimit);

        fetch(`/student/quiz/${quizId}`, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams({
                question_id: "{{ current_question.id }}",
                qindex: curIdx,
                selected_answer: val,
                time_taken: finalTime
            })
        })
        .then(r => r.json())
        .then(data => {
            console.log('✅ Answer submitted successfully:', data);
            
            // Notify server that this student has submitted
            socket.emit("student_submitted", {
                quiz_id: quizId,
                student: user,
                question_index: curIdx
            });
            
            showAnswerFeedback(val, data.is_correct);
            if (data.student_complete) {
                isLastQuestion = true;
            }
            
            // After showing feedback, redirect to leaderboard
            setTimeout(() => {
                console.log('🔄 Redirecting to leaderboard...');
                window.location.href = `/student/leaderboard/live/${quizId}?qindex=${curIdx}`;
            }, 2500);
        })
        .catch(err => {
            console.error("Error:", err);
            alert('Error submitting answer.');
            submitted = false;
            btn.disabled = false;
            btn.innerHTML = `<i class="fas fa-paper-plane me-2"></i>SUBMIT ANSWER`;
            
            // Re-enable radio buttons
            document.querySelectorAll("input[name='answer']").forEach(i => i.disabled = false);
        });
    }

    function showAnswerFeedback(selectedAnswer, isCorrect) {
        // Highlight correct and incorrect answers
        document.querySelectorAll(".option-content").forEach(opt => {
            const t = opt.getAttribute("data-option");
            if (t === correctAnswer) opt.classList.add("correct");
            if (t === selectedAnswer && !isCorrect) opt.classList.add("incorrect");
        });

        // Show result banner
        const banner = document.createElement("div");
        banner.className = `result-banner ${isCorrect ? "correct" : "incorrect"} animate__animated animate__zoomIn`;
        banner.innerHTML = `
            <div class="result-icon">
                <i class="fas fa-${isCorrect ? 'check-circle' : 'times-circle'}"></i>
            </div>
            <h3>${isCorrect ? "CORRECT!" : "INCORRECT"}</h3>
            <p class="mb-0">${isCorrect ? "Great job! Well done!" : "Better luck next time!"}</p>
        `;
        document.body.appendChild(banner);

        // Confetti for correct answer
        if (isCorrect) {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }

        // Remove banner after 2 seconds
        setTimeout(() => {
            banner.remove();
        }, 2000);
    }

    // Add keyboard shortcuts
    document.addEventListener('keydown', function(event) {
        if (submitted) return;
        
        // Number keys 1-4 for selecting options
        if (event.key >= '1' && event.key <= '4') {
            const index = parseInt(event.key) - 1;
            const radio = document.querySelectorAll('input[name="answer"]')[index];
            if (radio) {
                radio.checked = true;
                radio.dispatchEvent(new Event('change'));
            }
        }
        
        // Enter key to submit
        if (event.key === 'Enter') {
            document.getElementById("submitBtn").click();
        }
    });

    // Add visual feedback when option is selected
    document.querySelectorAll('input[name="answer"]').forEach(radio => {
        radio.addEventListener('change', function() {
            // Remove selected class from all options
            document.querySelectorAll('.option-label').forEach(label => {
                label.classList.remove('selected');
            });
            
            // Add selected class to current option
            if (this.checked) {
                this.parentElement.classList.add('selected');
            }
        });
    });

    console.log('📊 Quiz loaded:', {
        quizId: quizId,
        currentIndex: curIdx,
        totalQuestions: totalQs,
        quizType: 'Live Quiz (Auto-timed)',
        startTime: new Date(questionStartTime).toLocaleTimeString()
    });
</script>
</body>
</html>
