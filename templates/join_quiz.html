<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Quiz | QuizX</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <style>
        :root {
            --primary: #6fbf4a;
            --glass: rgba(255, 255, 255, 0.9);
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .join-card {
            background: var(--glass);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            max-width: 450px;
            width: 100%;
        }
        .bg-icon {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }
        .btn-join {
            background-color: var(--primary);
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            font-weight: 700;
            border: none;
            width: 100%;
            transition: all 0.3s;
        }
        .btn-join:hover {
            background-color: #5ea83c;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(111, 191, 74, 0.2);
        }
    </style>
</head>

<body>
    <div class="join-card text-center animate__animated animate__zoomIn">
        <i class="fas fa-rocket bg-icon"></i>
        <h2 class="fw-bold mb-1">Join the Quiz</h2>
        <p class="text-muted mb-4">You're joining <strong>{{ quiz.title }}</strong></p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show text-center" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="">
            <div class="mb-4 text-start">
                <label for="playerName" class="form-label fw-bold">Your Name</label>
                <input type="text" name="player_name" id="playerName" class="form-control form-control-lg rounded-3" 
                    placeholder="Enter your name" required autofocus>
            </div>
            <button type="submit" class="btn-join">
                <i class="fas fa-sign-in-alt me-2"></i> Join Now
            </button>
        </form>
        <p class="mt-4 text-muted small"><i class="fas fa-info-circle me-1"></i> Quick join, no sign up required.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
