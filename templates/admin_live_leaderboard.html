<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizX | Live Leaderboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_live_leaderboard.css') }}">
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title">Quiz<span>X</span></div>
        <div class="live"><span class="dot"></span> LIVE LEADERBOARD</div>
    </div>

    <div id="podium" class="podium"></div>

    <div id="list" class="list"></div>
</div>

<div class="gamification">
    <div class="fast">⚡ Fast Answer : +10 pts</div>
    <div class="normal">🕒 Normal Answer : +5 pts</div>
    <div class="late">🐢 Late Answer : +2 pts</div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    const quizId = {{ quiz_id }};
    const currentUserName = "{{ session.username or 'Guest' }}";
    const medalMap = {1:'🥇',2:'🥈',3:'🥉'};

    /* 🔹 FETCH INITIAL DATA */
    fetch(`/api/leaderboard/${quizId}`)
    .then(res => res.json())
    .then(res => {
        const data = res.leaderboard.map(p => ({
            name: p.student,
            score: p.points
        }));
        updateLeaderboard(data);
    });

    /* 🔹 SOCKET LIVE UPDATE */
    const socket = io();
    socket.emit("join_quiz", { quiz_id: quizId });

    socket.on("leaderboard_update", data => {
        updateLeaderboard(data);
    });

    /* 🔹 RENDER FUNCTION */
    function updateLeaderboard(data){
        const podium = document.getElementById("podium");
        const list = document.getElementById("list");
        podium.innerHTML = "";
        list.innerHTML = "";

        if(!data || data.length === 0){
            list.innerHTML = "<div class='empty'>Waiting for players…</div>";
            return;
        }

        const top3 = data.slice(0,3);
        const others = data.slice(3);
        const order = [1,0,2]; // Rank 2, Rank 1, Rank 3 for visual podium

        order.forEach(i=>{
            if(!top3[i]) return;
            const rank = i===0?2:i===1?1:3;
            const p = top3[i];
            const isMe = p.name === currentUserName;

            const div=document.createElement("div");
            div.className=`podium-item rank-${rank} ${isMe?'is-me':''}`;
            div.innerHTML=`
                <div class="avatar">
                    <span class="medal">${medalMap[rank]}</span>
                    ${p.name.charAt(0).toUpperCase()}
                </div>
                <div class="bar">
                    <div class="p-name">${p.name}${isMe?' <span class="you">YOU</span>':''}</div>
                    <div class="p-score">${p.score}</div>
                </div>`;
            podium.appendChild(div);
        });

        others.forEach((p,i)=>{
            const isMe=p.name===currentUserName;
            const row=document.createElement("div");
            row.className=`row ${isMe?'me':''}`;
            row.innerHTML=`
                <div class="num">${i+4}</div>
                <div class="avatar-sm">${p.name.charAt(0).toUpperCase()}</div>
                <div class="name">${p.name}${isMe?' <span class="you">YOU</span>':''}</div>
                <div class="score">${p.score}</div>`;
            list.appendChild(row);
        });
    }
</script>

</body>
</html>
