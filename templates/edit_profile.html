<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizX | Edit Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
</head>
<body>

<div class="dashboard-wrapper">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fas fa-bolt text-warning"></i>
                {% if user.role == 'admin' %}
                <span>QuizX Admin</span>
                {% else %}
                <span>QuizX Student</span>
                {% endif %}
            </div>
        </div>
        <nav class="sidebar-nav">
            {% if user.role == 'admin' %}
                <a href="{{ url_for('admin.dashboard') }}" class="nav-link">
                    <i class="fas fa-th-large"></i> Dashboard
                </a>
                <a href="{{ url_for('admin.quizzes') }}" class="nav-link">
                    <i class="fas fa-book"></i> Quizzes
                </a>
                <a href="{{ url_for('admin.quizzes') }}" class="nav-link">
                    <i class="fas fa-chart-line"></i> Analytics
                </a>
                <a href="{{ url_for('auth.profile') }}" class="nav-link active">
                    <i class="fas fa-user-circle"></i> Profile
                </a>
            {% else %}
                <a href="{{ url_for('student.dashboard') }}" class="nav-link">
                    <i class="fas fa-th-large"></i> Dashboard
                </a>
                <a href="{{ url_for('student.quizzes') }}" class="nav-link">
                    <i class="fas fa-play-circle"></i> Live Quizzes
                </a>
                <a href="{{ url_for('student.history') }}" class="nav-link">
                    <i class="fas fa-history"></i> My History
                </a>
                <a href="{{ url_for('auth.profile') }}" class="nav-link active">
                    <i class="fas fa-user-circle"></i> Profile
                </a>
            {% endif %}
        </nav>
        <div class="sidebar-footer">
            <a href="{{ url_for('auth.logout') }}" class="logout-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </aside>

    <main class="main-content">
        <div class="container-fluid p-4">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="glass-card p-5 animate-fade-in">
                        <div class="text-center mb-5">
                            <div class="profile-avatar-wrapper mx-auto mb-3">
                                <img src="https://ui-avatars.com/api/?name={{ user.username }}&size=128&background=6fbf4a&color=fff" class="profile-avatar" alt="User">
                            </div>
                            <h3 class="fw-800">Edit Your Profile</h3>
                            <p class="text-muted">Update your account information</p>
                        </div>

                        <form action="{{ url_for('auth.edit_profile') }}" method="POST">
                            <div class="mb-4">
                                <label class="form-label small fw-bold text-muted">Username (Fixed)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-0"><i class="fas fa-at text-muted"></i></span>
                                    <input class="form-control custom-input bg-light" value="{{ user.username }}" disabled>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small fw-bold text-muted">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                                    <input name="email" type="email" class="form-control custom-input border-start-0" value="{{ user.email }}" required>
                                </div>
                            </div>

                            <div class="d-flex gap-2 mt-5">
                                <a href="{{ url_for('auth.profile') }}" class="btn btn-light w-100 rounded-pill fw-bold">Cancel</a>
                                <button type="submit" class="btn btn-save-profile w-100 rounded-pill">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
