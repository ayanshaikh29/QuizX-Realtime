<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuizX | Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
</head>
<body>

<div class="register-card">

    <!-- LOGO -->
    <div class="logo-box">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="QuizX Logo">
    </div>

    <h3>Create Your Account 🚀</h3>
    <p class="subtitle">Join QuizX and start live quizzes</p>

    <!-- 🔥 ERROR MESSAGE (optional – you can add it if needed) -->
    {% if error %}
    <div class="alert alert-danger text-center mb-3">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input name="username" type="text" class="form-control"
                   placeholder="Choose a username" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input name="password" type="password" class="form-control"
                   placeholder="Create a password" required>
        </div>

        <div class="mb-4">
            <label class="form-label">Select Role</label>
            <select name="role" class="form-select">
                <option value="student">Student</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <button class="btn-green w-100">
            📝 Register
        </button>

        <p class="text-center mt-4 login-link">
            Already have an account?
            <a href="/login">Login</a>
        </p>

    </form>
</div>

</body>
</html>
