<!DOCTYPE html>
<html>
<head>
<title>Join Quiz | QuizX</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5" style="max-width:420px">

<div class="card p-4 shadow">
<h4 class="text-center mb-3">🔑 Join Quiz</h4>

<form method="POST">
<input name="code" class="form-control text-center fs-4"
       placeholder="Enter Quiz Code" required>

<button class="btn btn-success w-100 mt-3">
Join Quiz
</button>
</form>

{% if error %}
<div class="alert alert-danger mt-3 text-center">
{{ error }}
</div>
{% endif %}

</div>
</div>

</body>
</html>
