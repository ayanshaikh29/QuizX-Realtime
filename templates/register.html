<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuizX | Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(120deg, #f6f8fb, #eef6ea);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ================= REGISTER CARD ================= */
        .register-card {
            background: white;
            border-radius: 22px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            animation: fadeUp 0.8s ease;
        }

        /* ================= LOGO ================= */
        .logo-box {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-box img {
            height: 70px;
            animation: pop 0.8s ease;
        }

        h3 {
            text-align: center;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        /* ================= FORM ================= */
        .form-label {
            font-weight: 600;
        }

        .form-control,
        .form-select {
            border-radius: 14px;
            padding: 14px;
        }

        /* ================= BUTTON ================= */
        .btn-green {
            background: linear-gradient(120deg, #6fbf4a, #8ed36a);
            color: white;
            font-weight: 700;
            border-radius: 30px;
            padding: 12px;
            border: none;
            transition: 0.3s;
        }

        .btn-green:hover {
            transform: scale(1.05);
        }

        /* ================= LINKS ================= */
        .login-link a {
            color: #6fbf4a;
            font-weight: 600;
            text-decoration: none;
        }

        /* ================= ANIMATIONS ================= */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pop {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* ================= RESPONSIVE ================= */
        @media (max-width: 480px) {
            .register-card {
                padding: 30px 24px;
            }

            .logo-box img {
                height: 60px;
            }
        }
    </style>
</head>

<body>

<div class="register-card">

    <!-- LOGO -->
    <div class="logo-box">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="QuizX Logo">
    </div>

    <h3>Create Your Account 🚀</h3>
    <p class="subtitle">Join QuizX and start live quizzes</p>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input name="username" type="text" class="form-control"
                   placeholder="Choose a username" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input name="password" type="password" class="form-control"
                   placeholder="Create a password" required>
        </div>

        <div class="mb-4">
            <label class="form-label">Select Role</label>
            <select name="role" class="form-select">
                <option value="student">Student</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <button class="btn-green w-100">
            📝 Register
        </button>

        <p class="text-center mt-4 login-link">
            Already have an account?
            <a href="/login">Login</a>
        </p>

    </form>
</div>

</body>
</html>
