<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuizX | {{ quiz.title }} - Attempt Quiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/normal_attempt_quiz.css') }}">
</head>
<body>

<div class="quiz-box">
    <h2 class="quiz-title">{{ quiz.title }}</h2>

    <div class="cheat-alert" id="cheatAlert">
        Warning <span id="warnCount">1</span>/3 – Do not switch tabs or leave the quiz window!
    </div>

    <div class="top-bar">
        <div class="progress-text">
            Question {{ current_index + 1 }} of {{ total_questions }}
        </div>
    </div>

    <form id="quizForm">
        <input type="hidden" name="question_id" value="{{ current_question.id }}">
        <input type="hidden" name="qindex" value="{{ current_index }}">

        <h5 class="mb-4 fw-bold">{{ current_index + 1 }}. {{ current_question.question }}</h5>

        <div class="options mb-4">
            <label class="option">
                <input type="radio" name="selected_answer" value="{{ current_question.option1 }}">
                <span class="option-text">{{ current_question.option1 }}</span>
            </label>
            <label class="option">
                <input type="radio" name="selected_answer" value="{{ current_question.option2 }}">
                <span class="option-text">{{ current_question.option2 }}</span>
            </label>
            <label class="option">
                <input type="radio" name="selected_answer" value="{{ current_question.option3 }}">
                <span class="option-text">{{ current_question.option3 }}</span>
            </label>
            <label class="option">
                <input type="radio" name="selected_answer" value="{{ current_question.option4 }}">
                <span class="option-text">{{ current_question.option4 }}</span>
            </label>
        </div>

        <div class="warning" id="warningMsg">
            Please select an answer before proceeding.
        </div>

        <div class="text-end mt-4">
            <button type="button" class="btn btn-submit" id="submitBtn">Submit Answer</button>
        </div>

        <div id="feedback" class="feedback" style="display:none;"></div>
    </form>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    let warnings = 0;
    let quizId = {{ quiz_id }};
    let currentIndex = {{ current_index }};
    let isSubmitting = false;

    const cheatAlert = document.getElementById("cheatAlert");
    const warnCount = document.getElementById("warnCount");
    const warningMsg = document.getElementById("warningMsg");
    const submitBtn = document.getElementById("submitBtn");
    const socket = io();

    socket.emit("join_quiz", { quiz_id: quizId });

    // Start question timer (Still useful for tracking stats server-side, even if no visual timer)
    fetch(`/student/quiz/${quizId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `question_id={{ current_question.id }}&start_question=1`
    }).catch(err => console.error('Start question error:', err));

    submitBtn.addEventListener('click', handleSubmit);

    function handleSubmit() {
        if (isSubmitting) return;
        
        // Check for selection
        const selected = document.querySelector("input[name='selected_answer']:checked");
        // If triggered by anti-cheat (no event), we might not have a selection, but we must submit anyway.
        // However, for normal clicks, we enforce selection.
        if (!selected && warnings < 3) {
            warningMsg.style.display = "block";
            setTimeout(() => warningMsg.style.display = "none", 3000);
            return;
        }

        isSubmitting = true;

        // GET FORM DATA FIRST
        const formData = new FormData(document.getElementById("quizForm"));
        
        // Lock options
        document.querySelectorAll(".option").forEach(opt => {
            opt.classList.add("locked");
            const input = opt.querySelector("input");
            input.disabled = true;
            if (input.checked) opt.classList.add("selected");
        });

        submitBtn.disabled = true;
        submitBtn.textContent = "Submitting...";

        fetch(`/student/quiz/${quizId}`, {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            const feedback = document.getElementById("feedback");
            if (data.is_correct) {
                feedback.textContent = `✓ Correct!`;
                feedback.className = "feedback correct";
            } else {
                feedback.textContent = `✗ Incorrect`;
                feedback.className = "feedback incorrect";
            }
            feedback.style.display = "block";

            if (data.is_last) {
                setTimeout(() => {
                    window.location.href = `/leaderboard/live/${quizId}?qindex=done`;
                }, 1200);
            } else {
                setTimeout(() => {
                    window.location.href = `/leaderboard/live/${quizId}?qindex=${data.next_qindex}`;
                }, 1200);
            }
        })
        .catch(err => {
            console.error('Submit error:', err);
            isSubmitting = false;
            submitBtn.disabled = false;
            submitBtn.textContent = "Submit Answer";
        });
    }

    /* ===== ANTI-CHEAT SYSTEM ===== */
    function triggerWarning() {
        // Don't warn if already submitting
        if(isSubmitting) return;

        warnings++;
        warnCount.innerText = warnings;
        cheatAlert.style.display = "block";

        if (warnings >= 3) {
            alert("Too many violations! Your quiz is being submitted automatically.");
            // Force submit regardless of selection
            handleSubmit(); 
        }

        setTimeout(() => cheatAlert.style.display = "none", 4000);
    }

    document.addEventListener("visibilitychange", () => {
        if (document.hidden) triggerWarning();
    });

    window.addEventListener("blur", triggerWarning);

    document.addEventListener("contextmenu", e => e.preventDefault());
    document.addEventListener("copy", e => e.preventDefault());
    document.addEventListener("cut", e => e.preventDefault());
    document.addEventListener("paste", e => e.preventDefault());

    document.onkeydown = function(e) {
        if (
            e.key === "F12" ||
            (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J" || e.key === "C")) ||
            (e.ctrlKey && e.key === "u")
        ) {
            e.preventDefault();
            triggerWarning();
            return false;
        }
    };
</script>

</body>
</html>
